name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contract:
    name: Compile and test the Compact contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
        # pipefail matters here: the toolchain is installed with `curl ... | sh`,
        # and without it a failed download pipes an empty script into a shell
        # that exits 0. CI would go green having installed nothing.
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"

      - name: Pin the compiler
        run: compact update 0.31.0

      - name: Report toolchain versions
        run: |
          compact --version
          compact compile --version
          compact compile --language-version
          node --version

      - run: npm ci

      # --skip-zk: CI is answering "does this still compile and do the circuits
      # typecheck". Generating PLONK proving keys takes minutes and does not
      # improve that answer, so key generation stays in the local build that
      # actually deploys.
      - name: Compile
        run: npm run compact-fast

      - name: Check the compiler actually emitted a contract
        run: test -f src/managed/sealed-bid-auction/contract/index.js

      - name: Test
        run: npm test
